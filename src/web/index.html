<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#16121c">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Hallow">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<title>Hallow</title>
<style>
:root{--accent:#f07820;--on-accent:#1a0e04}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#16121c;color:#ece8f4;font:15px/1.35 "Segoe UI",system-ui,-apple-system,sans-serif;padding:16px 14px calc(30px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:22px;color:var(--accent);letter-spacing:.5px}h1 span{color:#ece8f4;font-weight:300}
.sub{color:#8f88a0;font-size:13px}
h2{font-size:12px;color:#a98be0;letter-spacing:.8px;text-transform:uppercase;margin:22px 2px 10px}
.card{background:#211b2a;border:1px solid #2e2639;border-radius:16px;padding:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#211b2a;border-radius:14px;padding:10px 8px;text-align:center}.stat b{display:block;font-size:19px}.stat small{color:#8f88a0;font-size:12px}
.warn{color:#f0be5a}.bad{color:#ff6b6b}
.mic{display:block;width:100%;margin-top:12px;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:700;background:#2a2333;color:#ece8f4}
.mic.on{background:#e0424c;color:#fff}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}
.row .n{width:86px;font-weight:600}.row .p{width:44px;text-align:right;color:#8f88a0;font-size:13px}
input[type=range]{flex:1;accent-color:var(--c,var(--accent));height:28px}
.btn{border:0;border-radius:12px;padding:9px 13px;background:#2a2333;color:#ece8f4;font-weight:600;font-size:14px}
.btn.m{min-width:64px}.btn.on{background:#e0424c;color:#fff}.btn.go{background:var(--accent);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.np .t{font-weight:700;font-size:16px}.np .a{color:#8f88a0;font-size:13px;margin:2px 0 10px}.np .b{display:flex;gap:8px}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.g{position:relative;border-radius:14px;overflow:hidden;background:#2a2333;aspect-ratio:460/215;border:0;padding:0;color:#fff;text-align:left}
.g img{width:100%;height:100%;object-fit:cover;display:block}.g span{position:absolute;left:8px;bottom:6px;right:8px;font-size:13px;font-weight:600;text-shadow:0 1px 4px #000}
.g .pl{position:absolute;top:6px;left:6px;background:#6ed28c;color:#0e2416;font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px}
.g .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font-weight:700}
.off{color:#8f88a0;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#241e2e;border:1px solid #3a3248;border-radius:12px;padding:10px 16px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
.session{display:flex;align-items:center;justify-content:space-between}
.clip{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-top:1px solid #2e2639;color:#ece8f4;padding:9px 0;text-align:left;font:inherit}
.clip:first-of-type{border-top:0}.clip img,.clip .ni{width:96px;height:54px;border-radius:8px;object-fit:cover;background:#2a2333;flex:none}
.clip b{display:block;font-size:14px}.clip small{color:#8f88a0;font-size:12px}
.vg{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #2e2639;font-size:14px}.vg:first-of-type{border-top:0}.vg span{color:#8f88a0;font-size:13px;text-align:right}
.power{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.power .btn{padding:14px 6px}
.btn:disabled{opacity:.55}
.tabs{display:flex;gap:6px;margin:0 0 14px}.tabs button{flex:1;border:0;border-radius:12px;padding:9px 6px;background:#211b2a;color:#8f88a0;font-weight:700;font-size:14px}.tabs button.on{background:var(--accent);color:var(--on-accent)}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.big .stat{padding:18px 8px}.big .stat b{font-size:34px;font-weight:700}.big .stat small{font-size:13px}
.src{color:#8f88a0;font-size:12px;margin:10px 2px 0}
.mine{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mine .btn{padding:20px 8px;font-size:15px;min-height:72px}
.ed{display:flex;gap:6px;align-items:center;margin:8px 0}.ed input{flex:1;min-width:0;background:#16121c;border:1px solid #3a3248;border-radius:10px;color:#ece8f4;padding:9px;font:inherit}.ed small{color:#8f88a0;font-size:11px;display:block}
select{background:#16121c;border:1px solid #3a3248;border-radius:10px;color:#ece8f4;padding:9px;font:inherit;flex:1;min-width:0}
#pad{height:46vh;min-height:240px;background:#211b2a;border:1px solid #2e2639;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;color:#8f88a0;font-size:13px;touch-action:none;user-select:none;-webkit-user-select:none}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.row3 .btn{padding:16px 4px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}.keys .btn{padding:12px 4px;font-size:13px}
#player{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:5}
#player video{flex:1;width:100%;min-height:0;background:#000}
#player .bar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#ece8f4}
</style></head>
<body>
<header><div><h1>HALLOW <span>REMOTE</span></h1><div class="sub" id="pc">Connecting...</div></div><div class="sub" id="time"></div></header>
<div class="tabs"><button id="t_home" class="on" onclick="tab('home')">Remote</button><button id="t_live" onclick="tab('live')">Stats</button><button id="t_mine" onclick="tab('mine')">Buttons</button><button id="t_pad" onclick="tab('pad')">Mouse</button></div>
<div id="v_pad" style="display:none"><div id="padoff" class="card off" style="display:none">The mouse and keyboard are off. Turn on <b>Let your phone use the mouse and keyboard</b> in Hallow Remote on your PC.</div>
<div id="padon"><div id="pad">Drag to move - tap to click<br>two fingers: tap = right click, drag = scroll</div>
<div class="row3"><button class="btn" ontouchstart="btnHold('left',event)" ontouchend="btnRelease('left',event)" onmousedown="btnHold('left',event)" onmouseup="btnRelease('left',event)">Left</button><button class="btn" onclick="inp('k=button&b=middle')">Middle</button><button class="btn" onclick="inp('k=button&b=right')">Right</button></div>
<div class="ed"><input id="kb" placeholder="Type here - it appears on the PC" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn go" onclick="sendText()">Send</button></div>
<div class="keys" id="keys"></div></div></div>
<div id="v_live" style="display:none"><div class="big" id="bigstats"></div><div class="src" id="livesrc"></div><div id="lastmatch"></div></div>
<div id="v_mine" style="display:none"><div class="mine" id="minegrid"></div><div id="mineedit"></div><button class="btn" style="width:100%;margin-top:14px" id="editbtn" onclick="toggleEdit()">Edit my buttons</button></div>
<div id="v_home">
<div class="stats" id="stats"></div>
<button class="mic" id="mic" style="display:none" onclick="act('a=mic')">Mic</button>
<div id="np"></div>
<div id="sysmedia"></div>
<div id="apps"></div>
<div id="mixer"></div>
<div id="games"></div>
<div id="session"></div>
<div id="clips"></div>
<div id="vault"></div>
<div id="overlay"></div>
<h2>This PC</h2><div class="power"><button class="btn" id="pw_sleep" onclick="power('sleep')">Sleep</button><button class="btn" id="pw_shutdown" onclick="power('shutdown')">Shut down</button><button class="btn" id="pw_lock" onclick="power('lock')">Lock</button></div>
</div>
<div id="player"><div class="bar"><b id="ptitle"></b><button class="btn" onclick="closePlayer()">Close</button></div><video id="video" controls playsinline preload="metadata"></video></div>
<div id="toast"></div>
<script>
var base = location.pathname.replace(/\/?$/, '/'), dragging = {}, last = null, lastGames = '';
var colors = { game: '#f07820', chat: '#a98be0', music: '#6ed28c', media: '#5ab4f0', other: '#8f88a0' };
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function toast(m) { var t = el('toast'); t.textContent = m; t.className = 'show'; clearTimeout(t._h); t._h = setTimeout(function () { t.className = ''; }, 2200); }
function act(q, quiet) {
  return fetch(base + 'api/do?' + q, { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (j) { if (!quiet || !j.ok) toast(j.msg); setTimeout(load, 300); }).catch(function () { toast('Your PC didn\'t answer'); });
}
var timers = {};
function slide(ch, v) { el('p_' + ch).textContent = v + '%'; clearTimeout(timers[ch]); timers[ch] = setTimeout(function () { act('a=set&ch=' + ch + '&v=' + v, true); }, 150); }
function stat(label, v, unit, cls) { return '<div class="stat"><b class="' + (cls || '') + '">' + (v < 0 ? '-' : v + unit) + '</b><small>' + label + '</small></div>'; }
function render(s) {
  if (view == 'pad') { el('padoff').style.display = s.input ? 'none' : ''; el('padon').style.display = s.input ? '' : 'none'; }
  if (view == 'live') renderLive(s); if (view == 'mine') renderMine(s);
  if (s.accent && s.accent !== curAccent) { curAccent = s.accent; var rs = document.documentElement.style; rs.setProperty('--accent', s.accent); rs.setProperty('--on-accent', s.onAccent || '#1a0e04'); }   // v1.5: the Hallow accent
  el('pc').textContent = s.pc; el('time').textContent = s.time;
  var t = s.stats, ram = t.ramTotal > 0 ? t.ramUsed / t.ramTotal : 0;
  el('stats').innerHTML = stat('CPU', t.cpu, '%', t.cpu > 90 ? 'warn' : '') + stat('GPU', t.gpu, '%') + stat('GPU temp', t.gpuTemp, '°', t.gpuTemp >= 85 ? 'bad' : t.gpuTemp >= 78 ? 'warn' : '') +
    stat('RAM', t.ramUsed < 0 ? -1 : t.ramUsed, ' GB', ram > .92 ? 'bad' : ram > .85 ? 'warn' : '');
  var mx = s.mixer, mic = el('mic');
  if (mx) {
    mic.style.display = 'block'; mic.className = 'mic' + (mx.mic.muted ? ' on' : ''); mic.textContent = mx.mic.muted ? 'Mic muted - tap to talk' : 'Mic on - tap to mute';
    var np = '';
    if (mx.nowPlaying) { var n = mx.nowPlaying; np = '<h2>Now playing</h2><div class="card np"><div class="t">' + esc(n.title) + '</div><div class="a">' + esc([n.artist, n.app].filter(Boolean).join(' - ')) + (n.playing ? '' : ' (paused)') +
      '</div><div class="b"><button class="btn" onclick="act(\'a=media&do=prev\')">&#9198;</button><button class="btn go" style="flex:1" onclick="act(\'a=media&do=playpause\')">' + (n.playing ? 'Pause' : 'Play') + '</button><button class="btn" onclick="act(\'a=media&do=next\')">&#9197;</button></div></div>'; }
    el('np').innerHTML = np;
    if (!Object.keys(dragging).some(function (k) { return dragging[k]; })) {
      var h = '<h2>Mixer</h2><div class="card">';
      mx.channels.forEach(function (c) {
        h += '<div class="row"><span class="n" style="color:' + (colors[c.id] || '#ece8f4') + '">' + esc(c.name.replace('System & other', 'System')) + '</span>' +
          '<input type="range" min="0" max="100" value="' + c.volume + '" style="--c:' + (colors[c.id] || '#f07820') + '" ontouchstart="dragging.' + c.id + '=1" ontouchend="dragging.' + c.id + '=0" onmousedown="dragging.' + c.id + '=1" onmouseup="dragging.' + c.id + '=0" oninput="slide(\'' + c.id + '\',this.value)">' +
          '<span class="p" id="p_' + c.id + '">' + c.volume + '%</span><button class="btn m' + (c.muted ? ' on' : '') + '" onclick="act(\'a=mute&ch=' + c.id + '\')">' + (c.muted ? 'Muted' : 'Mute') + '</button></div>';
      });
      h += '</div>';
      if (mx.presets && mx.presets.length) h += '<h2>Presets</h2><div class="chips">' + mx.presets.map(function (p) { return '<button class="btn go" onclick="act(\'a=preset&name=' + encodeURIComponent(p) + '\')">' + esc(p) + '</button>'; }).join('') + '</div>';
      el('mixer').innerHTML = h;
    }
  } else { mic.style.display = 'none'; el('np').innerHTML = ''; el('mixer').innerHTML = '<h2>Mixer</h2><div class="card off">Hallow Mixer isn\'t running on your PC.</div>'; }
  // v1.8: PC volume and what's playing without Hallow Mixer, and apps to open
  var sm = s.sys, sh = '';
  if (sm) {
    if (!mx && sm.np) { var n2 = sm.np; sh += '<h2>Now playing</h2><div class="card np"><div class="t">' + esc(n2.title) + '</div><div class="a">' + esc([n2.artist, n2.app].filter(Boolean).join(' - ')) + (n2.playing ? '' : ' (paused)') +
      '</div><div class="b"><button class="btn" onclick="act(\'a=pcmedia&do=prev\')">&#9198;</button><button class="btn go" style="flex:1" onclick="act(\'a=pcmedia&do=playpause\')">' + (n2.playing ? 'Pause' : 'Play') + '</button><button class="btn" onclick="act(\'a=pcmedia&do=next\')">&#9197;</button></div></div>'; }
    else if (!mx) sh += '<h2>Media</h2><div class="card np"><div class="b"><button class="btn" onclick="act(\'a=pcmedia&do=prev\')">&#9198;</button><button class="btn go" style="flex:1" onclick="act(\'a=pcmedia&do=playpause\')">Play / pause</button><button class="btn" onclick="act(\'a=pcmedia&do=next\')">&#9197;</button></div></div>';
    if (sm.volume >= 0 && !dragging.sysvol) sh += '<h2>PC volume</h2><div class="card"><div class="row" style="margin:0"><input type="range" min="0" max="100" value="' + sm.volume + '" ontouchstart="dragging.sysvol=1" ontouchend="dragging.sysvol=0" onmousedown="dragging.sysvol=1" onmouseup="dragging.sysvol=0" oninput="sysVol(this.value)">' +
      '<span class="p" id="p_sysvol">' + sm.volume + '%</span><button class="btn m' + (sm.muted ? ' on' : '') + '" onclick="act(\'a=volmute\')">' + (sm.muted ? 'Muted' : 'Mute') + '</button></div></div>';
    if (!dragging.sysvol && sh !== lastSys) { lastSys = sh; el('sysmedia').innerHTML = sh; }
  }
  var ak = JSON.stringify(s.apps || []);
  if (ak !== lastApps) { lastApps = ak; el('apps').innerHTML = !(s.apps || []).length ? '' : '<h2>Open on your PC</h2><div class="chips">' + s.apps.map(function (a) { return '<button class="btn" onclick="act(\'a=open&id=' + a.id + '\')">' + esc(a.name) + '</button>'; }).join('') + '</div>'; }
  var gk = JSON.stringify(s.games) + s.hub;
  if (gk !== lastGames) {
    lastGames = gk;
    var g = '<h2>Games</h2>';
    if (!s.hub) g += '<div class="card off">Hallow Hub isn\'t running on your PC.</div>';
    else g += '<div class="games">' + s.games.map(function (x, i) {
      return '<button class="g" onclick="play(' + i + ',\'' + esc(x.name).replace(/'/g, '') + '\')"><img src="' + base + 'api/cover/' + i + '" alt="" onerror="this.outerHTML=\'<div class=ph>' + esc(x.name).replace(/'/g, '') + '</div>\'">' +
        (x.playing ? '<div class="pl">PLAYING</div>' : '') + '<span>' + esc(x.name) + '</span></button>';
    }).join('') + '</div>';
    el('games').innerHTML = g;
  }
  el('session').innerHTML = s.session == null ? '' : '<h2>Hallow Toolkit</h2><div class="card session"><div><b>Game session</b><div class="sub">' + (s.session ? 'On - Boost apps closed, High performance power' : 'Off') + '</div></div>' +
    '<button class="btn ' + (s.session ? 'on' : 'go') + '" onclick="act(\'a=session\')">' + (s.session ? 'End' : 'Start') + '</button></div>';
  // v1.2: Hallow Clips, Vault, Overlay - each card only while that app is running
  var ck = JSON.stringify(s.clips);
  if (ck !== lastClips) {
    lastClips = ck; var c = s.clips, h = '';
    if (c) {
      h = '<h2>Hallow Clips</h2><div class="card"><div class="session"><div><b>' + (c.recording ? 'Recording' : 'Not recording') + '</b><div class="sub">' +
        (c.recording ? esc([c.game, c.seconds ? 'last ' + c.seconds + ' s' : ''].filter(Boolean).join(' - ')) : 'Start a game, or turn recording on in Hallow Clips') + '</div></div>' +
        '<button class="btn go" id="saveclip" onclick="saveClip()"' + (c.recording ? '' : ' disabled') + '>Save clip</button></div>';
      if (c.items.length) h += '<div style="margin-top:8px">' + c.items.map(function (x) {
        var t = esc([x.game, x.when].filter(Boolean).join(' - '));
        return '<button class="clip" onclick="watch(\'' + x.id + '\',\'' + t.replace(/'/g, '') + '\')">' + (x.thumb ? '<img loading="lazy" src="' + base + 'api/thumb/' + x.id + '" alt="">' : '<div class="ni"></div>') +
          '<div><b>' + (x.fav ? '&#9733; ' : '') + esc(x.game || 'Clip') + '</b><small>' + esc(x.when || '') + ' - ' + dur(x.sec) + ' - ' + (x.mb < 1 ? '&lt;1' : x.mb) + ' MB</small></div></button>';
      }).join('') + '</div>';
      else h += '<div class="sub" style="margin-top:10px">No clips yet.</div>';
      h += '</div>';
    }
    el('clips').innerHTML = h;
  }
  var v = s.vault;
  el('vault').innerHTML = !v ? '' : '<h2>Hallow Vault</h2><div class="card"><div class="session"><div><b>Game saves</b><div class="sub">' + (v.busy ? 'Backing up now...' : v.games.filter(function (g) { return g.last; }).length + ' of ' + v.games.length + ' games backed up') + '</div></div>' +
    '<button class="btn go" onclick="act(\'a=backup\')"' + (v.busy ? ' disabled' : '') + '>' + (v.busy ? 'Backing up' : 'Back up now') + '</button></div>' +
    (v.games.length ? '<div style="margin-top:8px">' + v.games.map(function (g) { return '<div class="vg"><b>' + esc(g.name) + '</b><span>' + (g.last ? esc(g.last) : 'Never') + '</span></div>'; }).join('') + '</div>' : '') + '</div>';
  var o = s.overlay;
  el('overlay').innerHTML = !o ? '' : '<h2>Hallow Overlay</h2><div class="card session"><div><b>Overlay</b><div class="sub">' + (o.visible ? 'On screen' : 'Hidden') + '</div></div>' +
    '<button class="btn ' + (o.visible ? '' : 'go') + '" onclick="act(\'a=overlay&do=' + (o.visible ? 'hide' : 'show') + '\')">' + (o.visible ? 'Hide' : 'Show') + '</button></div>';
}
var lastClips = '', curAccent = '', lastSys = '', lastApps = '';
function sysVol(v) { el('p_sysvol').textContent = v + '%'; clearTimeout(timers.sysvol); timers.sysvol = setTimeout(function () { act('a=vol&v=' + v, true); }, 150); }
function dur(sec) { sec = Math.round(sec || 0); return Math.floor(sec / 60) + ':' + ('0' + sec % 60).slice(-2); }
function saveClip() { var b = el('saveclip'); if (b) { b.disabled = true; b.textContent = 'Saving...'; } act('a=clip').then(function () { lastClips = ''; load(); }); }
function watch(id, title) { el('ptitle').textContent = title; var v = el('video'); v.src = base + 'api/clip/' + id; el('player').style.display = 'flex'; v.play().catch(function () {}); }
function closePlayer() { var v = el('video'); v.pause(); v.removeAttribute('src'); v.load(); el('player').style.display = 'none'; }
// sleep / shut down / lock: the first tap arms the button, a second tap within 4 s does it
var armed = {}, powerText = { sleep: 'Sleep', shutdown: 'Shut down', lock: 'Lock' };
function power(what) {
  var b = el('pw_' + what);
  if (!armed[what]) {
    armed[what] = setTimeout(function () { armed[what] = 0; b.className = 'btn'; b.textContent = powerText[what]; }, 4000);
    b.className = 'btn on'; b.textContent = 'Tap again'; return;
  }
  clearTimeout(armed[what]); armed[what] = 0; b.className = 'btn'; b.textContent = powerText[what];
  act('a=power&do=' + what);
}
// ---- v1.6: tabs, Live stats, My buttons
var view = 'home', editing = false, catalog = [], mine = [];
function tab(v) {
  view = v; ['home', 'live', 'mine', 'pad'].forEach(function (x) { el('v_' + x).style.display = x == v ? '' : 'none'; el('t_' + x).className = x == v ? 'on' : ''; });
  if (v == 'mine' && !catalog.length) loadButtons();
  if (last) render(last);
  if (!polling) { rev = 0; live(); }   // the live stats page asks every second
}
function renderLive(s) {
  var t = s.stats, o = s.overlay, lv = o && o.live, h = '';
  if (lv && lv.fps != null) h += stat('FPS', lv.fps, '', lv.fps < 30 ? 'bad' : lv.fps < 60 ? 'warn' : '');
  if (lv && lv.ping != null) h += stat('Ping', lv.ping, ' ms', lv.ping > 120 ? 'bad' : lv.ping > 70 ? 'warn' : '');
  if (lv && lv.region) h += '<div class="stat"><b style="font-size:22px">' + esc(lv.region) + '</b><small>Server</small></div>';
  h += stat('CPU', t.cpu, '%', t.cpu > 90 ? 'warn' : '') + stat('GPU', t.gpu, '%') + stat('GPU temp', t.gpuTemp, '&deg;', t.gpuTemp >= 85 ? 'bad' : t.gpuTemp >= 78 ? 'warn' : '') +
    stat('RAM', t.ramUsed < 0 ? -1 : t.ramUsed, ' GB');
  el('bigstats').innerHTML = h;
  el('livesrc').textContent = lv ? 'Game numbers from Hallow Overlay' + (lv.game ? ' - ' + lv.game : '') + ', PC numbers from Hallow Remote.' :
    o ? 'PC numbers from Hallow Remote. Hallow Overlay is running but isn\'t sharing live game numbers.' : 'PC numbers from Hallow Remote. Start Hallow Overlay for game numbers.';
  var m = o && o.lastMatch;
  el('lastmatch').innerHTML = !m ? '' : '<h2>Last match</h2><div class="card"><b>' + esc(m.game || 'Game') + '</b><div class="sub">' + esc([m.when, m.minutes ? Math.round(m.minutes) + ' min' : '',
    m.fps != null ? Math.round(m.fps) + ' fps average' : '', m.ping != null ? Math.round(m.ping) + ' ms ping' : '', m.stalls ? m.stalls + ' stalls' : ''].filter(Boolean).join(' - ')) + '</div>' +
    (m.summary ? '<div style="margin-top:6px">' + esc(m.summary) + '</div>' : '') + '</div>';
}
function renderMine(s) {
  mine = s.buttons || mine; if (editing) return;
  var mk = JSON.stringify(mine) + catalog.length; if (mk === lastMine || Object.keys(armedMine).some(function (k) { return armedMine[k]; })) return; lastMine = mk;
  el('minegrid').innerHTML = mine.length ? mine.map(function (b, i) {
    return '<button class="btn' + (b.danger ? '' : ' go') + '" id="mb_' + i + '" onclick="pressMine(' + i + ')">' + esc(b.label || labelOf(b.id)) + '</button>';
  }).join('') : '<div class="card off" style="grid-column:1/-1">No buttons yet - tap Edit to pick some from the actions you already have.</div>';
}
function labelOf(id) { for (var i = 0; i < catalog.length; i++) if (catalog[i].id == id) return catalog[i].label; return id; }
var armedMine = {}, lastMine = '';
function pressMine(i) {
  var b = mine[i], btn = el('mb_' + i);
  if (b.danger && !armedMine[i]) {   // power buttons keep their confirm tap
    var text = btn.textContent; btn.className = 'btn on'; btn.textContent = 'Tap again';
    armedMine[i] = setTimeout(function () { armedMine[i] = 0; btn.className = 'btn'; btn.textContent = text; }, 4000); return;
  }
  if (armedMine[i]) { clearTimeout(armedMine[i]); armedMine[i] = 0; lastMine = ''; renderMine({ buttons: mine }); }
  act('a=btn&i=' + i);
}
function loadButtons(set) {
  return fetch(base + 'api/buttons' + (set ? '?set=' + encodeURIComponent(JSON.stringify(set)) : ''), { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) { toast(j.msg); return; } catalog = j.catalog; mine = j.mine; if (set) toast('Saved'); if (editing) renderEdit(); else { lastMine = ''; renderMine({ buttons: mine }); } })
    .catch(function () { toast('Your PC didn\'t answer'); });
}
function toggleEdit() { editing = !editing; el('editbtn').textContent = editing ? 'Done' : 'Edit my buttons'; if (editing) { el('minegrid').innerHTML = ''; loadButtons(); } else { el('mineedit').innerHTML = ''; lastMine = ''; renderMine({ buttons: mine }); } }
function renderEdit() {
  var groups = {}; catalog.forEach(function (c) { (groups[c.group] = groups[c.group] || []).push(c); });
  el('mineedit').innerHTML = mine.map(function (b, i) {
    return '<div class="ed"><div style="flex:1;min-width:0"><input value="' + esc(b.label) + '" placeholder="' + esc(labelOf(b.id)) + '" maxlength="24" onchange="renameMine(' + i + ',this.value)"><small>' + esc(labelOf(b.id)) + '</small></div>' +
      '<button class="btn" onclick="moveMine(' + i + ',-1)">&#8593;</button><button class="btn" onclick="moveMine(' + i + ',1)">&#8595;</button><button class="btn" onclick="removeMine(' + i + ')">&#10005;</button></div>';
  }).join('') + '<div class="ed"><select id="addsel">' + Object.keys(groups).map(function (g) {
    return '<optgroup label="' + esc(g) + '">' + groups[g].map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.label) + '</option>'; }).join('') + '</optgroup>';
  }).join('') + '</select><button class="btn go" onclick="addMine()">Add</button></div>';
}
function saveMine() { loadButtons(mine.map(function (b) { return { id: b.id, label: b.label || '' }; })); }
function renameMine(i, v) { mine[i].label = v.trim(); saveMine(); }
function moveMine(i, d) { var j = i + d; if (j < 0 || j >= mine.length) return; var x = mine[i]; mine[i] = mine[j]; mine[j] = x; saveMine(); }
function removeMine(i) { mine.splice(i, 1); saveMine(); }
function addMine() { var id = el('addsel').value; if (!id) return; if (mine.length >= 24) { toast('At most 24 buttons'); return; } mine.push({ id: id, label: '' }); saveMine(); }
// ---- v1.7: trackpad and keyboard (only works while the switch on the PC is on)
function inp(q) { return fetch(base + 'api/input?' + q, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { if (!j.ok) toast(j.msg); return j; }).catch(function () {}); }
var acc = { dx: 0, dy: 0, sy: 0 }, sending = false, moved = false, multi = false, start = 0, holdBtn = null;
function flush() {
  if (sending) return;
  var sy = acc.sy > 0 ? Math.floor(acc.sy) : Math.ceil(acc.sy), dx = Math.round(acc.dx), dy = Math.round(acc.dy), q;
  if (sy) { acc.sy -= sy; q = 'k=scroll&dy=' + sy; }
  else if (dx || dy) { acc.dx -= dx; acc.dy -= dy; q = 'k=move&dx=' + dx + '&dy=' + dy; }
  else return;
  sending = true; inp(q).then(function () { sending = false; flush(); });
}
function padSetup() {
  var p = el('pad'), last = null;
  p.addEventListener('touchstart', function (e) { e.preventDefault(); if (e.touches.length > 1) multi = true; else { multi = false; moved = false; start = Date.now(); } var t = e.touches[0]; last = { x: t.clientX, y: t.clientY }; }, { passive: false });
  p.addEventListener('touchmove', function (e) {
    e.preventDefault(); var t = e.touches[0]; if (!last) { last = { x: t.clientX, y: t.clientY }; return; }
    var dx = t.clientX - last.x, dy = t.clientY - last.y; last = { x: t.clientX, y: t.clientY };
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    if (e.touches.length > 1) acc.sy -= dy / 25;
    else { var sp = Math.sqrt(dx * dx + dy * dy), gain = 1.6 + Math.min(2.4, sp / 12); acc.dx += dx * gain; acc.dy += dy * gain; }
    flush();
  }, { passive: false });
  p.addEventListener('touchend', function (e) {
    e.preventDefault(); if (e.touches.length) return;
    if (!moved && Date.now() - start < 300) inp('k=button&b=' + (multi ? 'right' : 'left'));
    last = null;
  }, { passive: false });
  // with a mouse (testing on a computer)
  var md = null;
  p.addEventListener('mousedown', function (e) { md = { x: e.clientX, y: e.clientY }; moved = false; });
  p.addEventListener('mousemove', function (e) { if (!md) return; var dx = e.clientX - md.x, dy = e.clientY - md.y; if (Math.abs(dx) + Math.abs(dy) > 2) moved = true; acc.dx += dx * 2; acc.dy += dy * 2; md = { x: e.clientX, y: e.clientY }; flush(); });
  p.addEventListener('mouseup', function () { if (md && !moved) inp('k=button&b=left'); md = null; });
  var keys = [['Esc', 'esc'], ['Tab', 'tab'], ['&#8593;', 'up'], ['&#9003;', 'backspace'], ['Home', 'home'], ['&#8592;', 'left'], ['&#8595;', 'down'], ['&#8594;', 'right'], ['PgUp', 'pgup'], ['PgDn', 'pgdn'], ['F5', 'f5'], ['Enter', 'enter']];
  el('keys').innerHTML = keys.map(function (k) { return '<button class="btn" onclick="inp(\'k=key&name=' + k[1] + '\')">' + k[0] + '</button>'; }).join('');
  el('kb').addEventListener('keydown', function (e) { if (e.key == 'Enter') { e.preventDefault(); sendText(true); } });
}
function sendText(enter) {
  var v = el('kb').value; el('kb').value = '';
  var p = v ? inp('k=text&t=' + encodeURIComponent(v.slice(0, 500))) : Promise.resolve();
  if (enter) p.then(function () { inp('k=key&name=enter'); });
}
// hold Left to drag
function btnHold(b, e) { e.preventDefault(); holdBtn = b; inp('k=button&b=' + b + '&s=down'); }
function btnRelease(b, e) { e.preventDefault(); if (holdBtn) inp('k=button&b=' + b + '&s=up'); holdBtn = null; }
padSetup();
function play(i, name) { if (confirm('Start ' + name + ' on your PC?')) act('a=play&i=' + i); }
function load() {
  fetch(base + 'api/state', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) { last = s; render(s); })
    .catch(function () { el('pc').textContent = 'Can\'t reach your PC - is it on, and is Hallow Remote running?'; });
}
// v1.3: live updates - api/wait answers as soon as something changes on the PC (or after a few seconds with fresh stats).
// A PC with an older Hallow Remote answers 404: then the page just asks every 2.5 s, as before.
var rev = 0, liveRun = 0, polling = false;
function live() {
  var run = ++liveRun;
  (function next() {
    if (run !== liveRun || document.hidden) return;
    fetch(base + 'api/wait?rev=' + rev + (view == 'live' ? '&fast=1' : ''), { cache: 'no-store' }).then(function (r) { if (r.status == 404) throw 'old'; return r.json(); })
      .then(function (s) { if (run !== liveRun) return; rev = s.rev; last = s; render(s); next(); })
      .catch(function (e) {
        if (e === 'old') { liveRun++; polling = true; load(); setInterval(function () { if (!document.hidden) load(); }, 2500); return; }
        el('pc').textContent = 'Can\'t reach your PC - is it on, and is Hallow Remote running?'; setTimeout(next, 3000);
      });
  })();
}
live();
document.addEventListener('visibilitychange', function () { if (!document.hidden) { if (polling) load(); else { rev = 0; live(); } } });
</script>
